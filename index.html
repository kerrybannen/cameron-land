<head>

<body>
  <header>
    <nav>
      <div>
        <ul>
          <li>
            <a>Cameron Family Land Map</a>
          </li>
          <li style="float:right">
            <a class="nav-link" href="#">About</a>
          <li style="float:right">
            <a class="nav-link" href="familytree.html">Family Tree</a>

          <li style="float:right">

          </li>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <div id='map'></div>
  <div class="dateslider-box">
    <div class="dateslider-inner">
      <p><strong>Date: </strong>
        <span type="text" id="amount"></span>
      </p>
      <p><input type="range" min=-6122027038000 max=-315601438000 step=86400000 value=-6109585200000 id="dateslider">
      </p>
    </div>
  </div>
  <div class="toggle-box">

    <p><label for="satellite-toggle">Satellite</label>
      <input type="checkbox" id="satellite-toggle" class="switch"><span class="slider"></span>
    </p>
    <p><label for="labels-toggle">Owners</label>
      <input type="checkbox" id="labels-toggle" class="switch" checked><span class="slider"></span>
    </p>
    <p><label for="borders-toggle">Borders</label>
      <input type="checkbox" id="borders-toggle" class="switch" checked><span class="slider"></span>
    </p>
    <p style="text-align: left;"><label for="plantations-toggle">19th century <br> place names</label>
      <input type="checkbox" id="plantations-toggle" class="switch"><span class="slider"></span>
    </p>
  </div>
